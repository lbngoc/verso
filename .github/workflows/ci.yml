name: CI

# Version tags are checked by release.yml's `check` job; running this workflow on tags too would
# repeat the same macOS/Windows jobs and double the billable minutes.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Frontend lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Build (no bundle)
        run: npm run tauri build -- --no-bundle

  bundle:
    name: Bundle size (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installers
        # The size gate does not need signed updater artifacts; those are signed only in the release
        # workflow, which holds the key. A file avoids shell quoting differences (bash vs PowerShell).
        run: npm run tauri build -- --config scripts/ci-no-updater.json
      - name: Check installer budget (<30 MB)
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' artifact; do
            size=$(wc -c < "$artifact")
            echo "$artifact: $size bytes"
            if [ "$size" -gt 31457280 ]; then
              echo "::error file=$artifact::installer exceeds the 30 MB budget"
              exit 1
            fi
            found=1
          done < <(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*-setup.exe' \) -print0)
          if [ "$found" -ne 1 ]; then
            echo "::error::no installer was produced"
            exit 1
          fi
