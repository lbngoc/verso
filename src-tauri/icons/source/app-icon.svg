<!-- Verso app icon (logo "S-flow"): a capital V wrapped by a wide S whose two ends are opposite arrows.
     The S is split at its spine into two colours, one per translation direction (teal out, coral back),
     and passes behind the V with a gap so the V stays whole. Everything is drawn as paths, so no font is needed.
     Render to src-tauri/icons/app-icon.png (1024 px), then `npx tauri icon src-tauri/icons/app-icon.png`.
     NOTE: `tauri icon` rewrites this file when given it directly, so always pass the PNG, never this SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1d8a78"/>
      <stop offset="1" stop-color="#0b3d37"/>
    </linearGradient>
    <!-- the S is cut 20 units clear of the V -->
    <mask id="clear-of-v" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="#fff"/>
      <polygon points="390,350 462,350 512,548 562,350 634,350 548,682 476,682"
               stroke="#000" stroke-width="40" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <g mask="url(#clear-of-v)" fill="none" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- top half: arrow pointing right, upper bowl, left half of the spine -->
    <path stroke="#2ee6c8" d="M806 282H344A115 115 0 0 0 344 512H512M756 232L806 282L756 332"/>
    <!-- bottom half: right half of the spine, lower bowl, arrow pointing left -->
    <path stroke="#ff8a5c" d="M512 512H680A115 115 0 0 1 680 742H218M268 692L218 742L268 792"/>
  </g>
  <polygon fill="#fff" points="390,350 462,350 512,548 562,350 634,350 548,682 476,682"/>
</svg>
